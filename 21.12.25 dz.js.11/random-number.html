<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="container">
        <h1>Случайное число от 0 до N</h1>

        <form class="form" id="generator-form" novalidate>
            <label for="max-value" class="label">
                Введите целое неотрицательное число N:
            </label>
            <input
                type="number"
                id="max-value"
                class="input"
                placeholder="Например, 100"
                min="0"
                step="1"
                autocomplete="off"
            >
            <button type="submit" class="button">Сгенерировать число</button>
        </form>

        <div id="result" class="result hidden"></div>
    </div>

    <script src="app.js"></script>

</body>
</html>
